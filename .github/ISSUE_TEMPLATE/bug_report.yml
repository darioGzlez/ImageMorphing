name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest SwiftUI example that reproduces the issue.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include ImageMorphing, Swift, Xcode, OS, and device versions.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs, screenshots, or Instruments traces when relevant.
